<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舒華 × Burberry 應援企劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --camel:#b98f56;
    --camel-deep:#8a6a3c;
    --cream:#f6f1e6;
    --paper:#fbf8f2;
    --ink:#1c1912;
    --ink-soft:#4a4436;
    --line:#ddd3bd;
    --green:#3f5a3d;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  a{color:inherit;}
  .wrap{max-width:620px;margin:0 auto;position:relative;}

  .hero{position:relative; background:var(--ink); overflow:hidden;}
  .hero img{width:100%; display:block; height:340px; object-fit:cover; object-position:50% 20%; opacity:.92;}
  .hero-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,17,12,.05) 0%, rgba(20,17,12,.15) 45%, rgba(20,17,12,.92) 100%);}
  .hero-content{position:absolute; left:0; right:0; bottom:0; padding:20px 24px 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:14px;}
  .hero-title{flex:1;}
  .hero-eyebrow{color:#d9c9a3; font-size:11.5px; letter-spacing:.14em; margin:0 0 6px; font-family:'Inter',sans-serif; font-weight:600;}
  .hero-h1{font-family:'Newsreader', Georgia, serif; font-weight:500; font-style:italic; color:#fbf8f2; font-size:30px; line-height:1.14; margin:0 0 6px; letter-spacing:.002em;}
  .hero-sub{color:#cdbf9e; font-size:13px; margin:0; line-height:1.4;}
  .lang-toggle{position:absolute; top:14px; left:14px; display:flex; border:1px solid rgba(255,255,255,.35); border-radius:20px; overflow:hidden; backdrop-filter:blur(4px);}
  .lang-toggle button{background:rgba(20,17,12,.45); color:#cdbf9e; border:none; font-size:11px; font-weight:600; padding:6px 12px; cursor:pointer; font-family:'Inter',sans-serif; letter-spacing:.03em;}
  .lang-toggle button.active{background:#f6f1e6; color:#1c1912;}

  .stat-strip{display:flex; border-bottom:1px solid var(--line); background:var(--paper);}
  .stat-cell{flex:1; text-align:center; padding:14px 6px; border-right:1px solid var(--line);}
  .stat-cell:last-child{border-right:none;}
  .stat-num{font-family:'Newsreader', serif; font-size:22px; font-weight:600; display:block; line-height:1;}
  .stat-label{font-size:10.5px; color:var(--ink-soft); margin-top:5px; display:block; letter-spacing:.03em;}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; padding:22px 20px 10px;}
  .section-title{font-family:'Newsreader', serif; font-style:italic; font-size:19px; margin:0; font-weight:500;}
  .section-note{font-size:11.5px; color:var(--ink-soft);}

  .filter-row{display:flex; gap:6px; padding:0 20px 14px; flex-wrap:wrap;}
  .filter-chip{border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-size:11.5px; padding:6px 12px; border-radius:20px; cursor:pointer; font-family:'Inter',sans-serif;}
  .filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .post-list{padding:0 20px 6px; display:flex; flex-direction:column; gap:10px;}
  .post-card{border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; background:var(--paper); position:relative;}
  .post-card.done{opacity:.55;}
  .post-top{display:flex; align-items:center; gap:9px; margin-bottom:9px;}
  .plat-badge{font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 7px; border-radius:3px; background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; flex-shrink:0;}
  .post-account{font-size:13.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pin-mark{color:var(--camel-deep); font-size:12px;}
  .post-note{font-size:12px; color:var(--ink-soft); margin:0 0 10px; line-height:1.45;}
  .post-actions{display:flex; gap:8px; align-items:center;}
  .btn{flex:1; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:8px 13px; border-radius:3px; border:1px solid var(--ink); cursor:pointer; text-decoration:none; text-align:center; background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; justify-content:center; gap:5px;}
  .btn:active{opacity:.7;}
  .done-toggle{width:36px; height:36px; flex-shrink:0; border-radius:3px; border:1px solid var(--line); background:var(--cream); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--ink-soft);}
  .done-toggle.checked{background:var(--green); border-color:var(--green); color:#fff;}
  .done-toggle:active{opacity:.7;}
  .empty-state{padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.6;}

  footer{text-align:center; padding:20px 20px 34px; font-size:11px; color:var(--ink-soft); letter-spacing:.03em; line-height:1.7;}
  ::selection{background:var(--camel); color:#fff;}
</style>
</head>

    <div class="hero-scrim"></div>

      <button data-lang="zh">中文</button>

      <div class="hero-title">

    <div class="stat-cell"><span class="stat-num" id="statTotal">0</span><span class="stat-label" id="statTotalLabel"></span></div>
    <div class="stat-cell"><span class="stat-num" id="statDone">0</span><span class="stat-label" id="statDoneLabel"></span></div>
    <div class="stat-cell"><span class="stat-num" id="statPending">0</span><span class="stat-label" id="statPendingLabel"></span></div>
  </div>

  <div class="section-head">
    <h2 class="section-title" id="sectionTitle"></h2>
    <span class="section-note" id="lastUpdated"></span>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="post-list" id="postList"></div>

  <footer id="footerText"></footer>
</div>

<script>
(function(){
  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTBzv7kOHZvvAh-RAAtR_SW0B8EvLbfY72C43SGtJcJ8hUf7HodqVG76ME9pGN0ZT0zVO1uw1zdcaWe/pub?output=csv";

  var header = {
    titleZh:"舒華 × Burberry", titleEn:"SHUHUA × BURBERRY",
    subtitleZh:"陪舒華應援時裝週每一則貼文", subtitleEn:"Cheering for Shuhua, one post at a time",
    periodZh:"粉絲應援企劃", periodEn:"Fan Engagement Project"
  };
  var posts = [];
  var lastUpdated = null;
  var loadError = false;
  var activeFilter = "all";
  var lang = "zh";
  try{
    var saved = localStorage.getItem("shuhua_lang");
    if(saved==="zh"||saved==="en") lang = saved;
  }catch(e){}

  var myDone = {};
  try{
    var savedDone = JSON.parse(localStorage.getItem("shuhua_my_done") || "{}");
    if(savedDone && typeof savedDone === "object") myDone = savedDone;
  }catch(e){}
  function postKey(p){
    var s = p.platform+"||"+p.account+"||"+p.link;
    var h = 5381;
    for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  function toggleMyDone(key){
    myDone[key] = !myDone[key];
    try{ localStorage.setItem("shuhua_my_done", JSON.stringify(myDone)); }catch(e){}
    render();
  }

  var platformOrder = ["X","IG","TT","FB","YT","WB","其他"];

  var STR = {
    zh:{
      statTotal:"總任務", statDone:"已完成", statPending:"待應援",
      sectionTitle:"應援任務", updatedAt:"更新於 ", filterAll:"全部",
      goEngage:"前往互動",
      markDone:"標記我已完成",
      emptyView:"目前沒有任務，請稍候管理者更新。",
      loadErr:"讀取任務清單失敗，請稍後重新整理。",
      footer1:"舒華應援企劃 · 由 WWW SHUHUA 整理維護"
    },
    en:{
      statTotal:"Total", statDone:"Done", statPending:"Pending",
      sectionTitle:"Engagement Tasks", updatedAt:"Updated ", filterAll:"All",
      goEngage:"Engage",
      markDone:"Mark as done",
      emptyView:"No tasks yet — check back soon.",
      loadErr:"Couldn't load the task list — try refreshing.",
      footer1:"Shuhua Fan Project · Maintained by WWW SHUHUA"
    }
  };
  function t(key){ return STR[lang][key]; }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(ts){
    if(!ts) return "";
    var d = new Date(ts);
    var mm = d.getMonth()+1, dd = d.getDate();
    var hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
    return mm+"/"+dd+" "+hh+":"+mi;
  }

  // Minimal RFC4180-ish CSV parser (handles quoted fields, commas and newlines inside quotes)
  function parseCsv(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else{ inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else{ field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToPosts(rows){
    if(rows.length < 1) return [];
    var hdr = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var idx = {};
    hdr.forEach(function(h,i){ idx[h] = i; });
    var out = [];
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      if(!row || row.every(function(c){return !c || !c.trim();})) continue;
      var account = (row[idx.account]||"").trim();
      var link = (row[idx.link]||"").trim();
      if(!account && !link) continue;
      out.push({
        platform: (row[idx.platform]||"").trim() || "其他",
        account: account,
        link: link,
        note: (row[idx.note]||"").trim(),
        pinned: /^true$/i.test((row[idx.pinned]||"").trim()),
        done: /^true$/i.test((row[idx.done]||"").trim()),
        addedAt: r
      });
    }
    return out;
  }

  function setLang(l){
    lang = l;
    try{ localStorage.setItem("shuhua_lang", l); }catch(e){}
    render();
  }

  function render(){
    document.documentElement.lang = lang==="zh" ? "zh-Hant" : "en";
    document.querySelectorAll("#langToggle button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-lang")===lang);
    });
    document.getElementById("titleText").textContent = lang==="zh" ? header.titleZh : header.titleEn;
    document.getElementById("subtitleText").textContent = lang==="zh" ? header.subtitleZh : header.subtitleEn;
    document.getElementById("periodText").textContent = lang==="zh" ? header.periodZh : header.periodEn;

    document.getElementById("statTotalLabel").textContent = t("statTotal");
    document.getElementById("statDoneLabel").textContent = t("statDone");
    document.getElementById("statPendingLabel").textContent = t("statPending");
    document.getElementById("sectionTitle").textContent = t("sectionTitle");
    document.getElementById("footerText").textContent = t("footer1");

    var sorted = posts.slice().sort(function(a,b){
      var aDone = a.done || !!myDone[postKey(a)];
      var bDone = b.done || !!myDone[postKey(b)];
      if(aDone !== bDone) return aDone ? 1 : -1;
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return a.addedAt - b.addedAt;
    });
    var total = sorted.length;
    var done = sorted.filter(function(p){return p.done || !!myDone[postKey(p)];}).length;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPending").textContent = total - done;
    document.getElementById("lastUpdated").textContent = lastUpdated ? (t("updatedAt")+fmtDate(lastUpdated)) : "";

    var platformsPresent = {};
    sorted.forEach(function(p){ platformsPresent[p.platform] = true; });
    var chips = ['<button class="filter-chip'+(activeFilter==="all"?" active":"")+'" data-f="all">'+t("filterAll")+'</button>'];
    platformOrder.forEach(function(pl){
      if(platformsPresent[pl]){
        chips.push('<button class="filter-chip'+(activeFilter===pl?" active":"")+'" data-f="'+pl+'">'+pl+'</button>');
      }
    });
    document.getElementById("filterRow").innerHTML = chips.join("");

    var visible = activeFilter==="all" ? sorted : sorted.filter(function(p){return p.platform===activeFilter;});
    var listEl = document.getElementById("postList");
    if(loadError){
      listEl.innerHTML = '<div class="empty-state">'+t("loadErr")+'</div>';
    } else if(visible.length===0){
      listEl.innerHTML = '<div class="empty-state">'+t("emptyView")+'</div>';
    } else {
      listEl.innerHTML = visible.map(function(p){
        var key = postKey(p);
        var checked = !!myDone[key];
        var eff = p.done || checked;
        return (
          '<div class="post-card'+(eff?" done":"")+'">'+
            '<div class="post-top">'+
              '<span class="plat-badge">'+escapeHtml(p.platform)+'</span>'+
              '<span class="post-account">'+escapeHtml(p.account)+'</span>'+
              (p.pinned? '<span class="pin-mark">★</span>' : '')+
            '</div>'+
            (p.note? '<p class="post-note">'+escapeHtml(p.note)+'</p>' : '')+
            '<div class="post-actions">'+
              '<a class="btn" href="'+escapeHtml(p.link)+'" target="_blank" rel="noopener">'+t("goEngage")+'</a>'+
              '<button class="done-toggle'+(checked?" checked":"")+'" data-key="'+key+'" title="'+t("markDone")+'">'+(checked?"✅":"☐")+'</button>'+
            '</div>'+
          '</div>'
        );
      }).join("");
    }
    bindFilterChips();
    bindDoneToggles();
  }

  function bindDoneToggles(){
    document.querySelectorAll(".done-toggle").forEach(function(el){
      el.onclick = function(){
        toggleMyDone(el.getAttribute("data-key"));
      };
    });
  }

  function bindFilterChips(){
    document.querySelectorAll(".filter-chip").forEach(function(el){
      el.onclick = function(){
        activeFilter = el.getAttribute("data-f");
        render();
      };
    });
  }

  document.querySelectorAll("#langToggle button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
  });

  function loadData(){
    fetch(CSV_URL + "&_=" + Date.now(), {cache:"no-store"})
      .then(function(r){
        if(!r.ok) throw new Error("http "+r.status);
        return r.text();
      })
      .then(function(text){
        posts = rowsToPosts(parseCsv(text));
        lastUpdated = Date.now();
        loadError = false;
        render();
      })
      .catch(function(err){
        console.error("load failed", err);
        if(posts.length===0){ loadError = true; render(); }
      });
  }

  render();
  loadData();
  setInterval(loadData, 60000);
})();
</script>
</body>
</html>
